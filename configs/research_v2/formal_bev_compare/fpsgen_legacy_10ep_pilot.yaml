# B16 is per rank; global batch is 32. No resume.
experiment: {id: fpsgen_formal_compare_fpsgen_legacy_10ep_pilot}
data:
  data_dir: ''
  gt_dir: gt_possion
  resolution: 0.05
  dataloader: KITTI
  split: train
  train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
  num_points: 180000
  max_range: 50.0
  dataset_norm: false
  std_axis_norm: false
  zero_copy_numpy: true
  fast_y_flip: true
train:
  n_gpus: 2
  batch_size: 16
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  deterministic_worker_init: true
  dataloader_seed: 42
  max_epoch: 10
  checkpoint_every_n_epochs: 50
  lr: 0.0001
  seed: 42
runtime:
  precision: fp16
  grad_scaler_init_scale: 8192
  compile_dense: true
  compile_backend: inductor
  deterministic: false
  allow_tf32: true
  cudnn_benchmark: true
  async_batch_transfer: true
  train_vis_interval: 0
  throughput_mode: lightweight
  throughput_interval_steps: 100
  throughput_csv: outputs/research_v2/formal_bev_compare/fpsgen_legacy_10ep_pilot/throughput.csv
  formal_manifest_dir: outputs/research_v2/formal_bev_compare/fpsgen_legacy_10ep_pilot
model:
  backbone: legacy
