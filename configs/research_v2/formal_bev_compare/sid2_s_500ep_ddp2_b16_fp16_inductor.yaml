# B16 is per rank; global batch is 32. No resume.
experiment: {id: fpsgen_formal_compare_sid2_s_500ep_ddp2_b16_fp16_inductor}
data:
  data_dir: ''
  gt_dir: gt_possion
  resolution: 0.05
  dataloader: KITTI
  split: train
  train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
  num_points: 180000
  max_range: 50.0
  dataset_norm: false
  std_axis_norm: false
  zero_copy_numpy: true
  fast_y_flip: true
train:
  n_gpus: 2
  batch_size: 16
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  deterministic_worker_init: true
  dataloader_seed: 42
  max_epoch: 500
  checkpoint_every_n_epochs: 50
  lr: 0.0001
  seed: 42
runtime:
  precision: fp16
  grad_scaler_init_scale: 8192
  compile_dense: true
  compile_backend: inductor
  deterministic: false
  allow_tf32: true
  cudnn_benchmark: true
  async_batch_transfer: true
  train_vis_interval: 0
  throughput_mode: lightweight
  throughput_interval_steps: 100
  formal_stall_gate: true
  formal_stall_policy: sustained
  throughput_csv: outputs/research_v2/formal_bev_compare/sid2_s_500ep_ddp2_b16_fp16_inductor/throughput.csv
  formal_manifest_dir: outputs/research_v2/formal_bev_compare/sid2_s_500ep_ddp2_b16_fp16_inductor
model:
  backbone: sid2_s
  flow: {type: linear}
  condition: {lidar_channels: 32, layout_channels: 2, fusion: separate_first, spatial: true, global: true, gate_init: 0.1, bias: false}
  sid2:
    input_size: 256
    patch_size: 2
    in_channels: 3
    channels: [64, 128, 256, 384]
    num_updown_blocks: [3, 3, 3]
    num_mid_blocks: 16
    block_types: [resblock, resblock, transformer, transformer]
    head_dim: 64
    time_dim: 256
