# Same selected formal architecture/runtime; only epoch horizon and output IDs differ.
experiment: {id: fpsgen_formal_compare_dic_s_10ep_pilot_eager_checkpointed}
data:
  data_dir: ''
  gt_dir: gt_possion
  resolution: 0.05
  dataloader: KITTI
  split: train
  train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
  num_points: 180000
  max_range: 50.0
  dataset_norm: false
  std_axis_norm: false
  zero_copy_numpy: true
  fast_y_flip: true
train:
  n_gpus: 2
  batch_size: 16
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  deterministic_worker_init: true
  dataloader_seed: 42
  max_epoch: 10
  checkpoint_every_n_epochs: 50
  lr: 0.0001
  seed: 42
runtime:
  precision: fp16
  compile_dense: false
  compile_backend: inductor
  activation_checkpointing: true
  grad_scaler_init_scale: 8192
  backend_exception: 'DiC checkpointed Inductor fails in torch2.0.1: FakeTensor GroupNorm conversion; eager B16 revalidated.'
  compile_failure_stage: outputs/research_v2/formal_bev_compare/dic_s_inductor_b16_checkpointed_rng_safe_v2/stage_status.json
  deterministic: false
  allow_tf32: true
  cudnn_benchmark: true
  async_batch_transfer: true
  train_vis_interval: 0
  throughput_mode: lightweight
  throughput_interval_steps: 100
  throughput_csv: outputs/research_v2/formal_bev_compare/dic_s_pilot/throughput.csv
  formal_manifest_dir: outputs/research_v2/formal_bev_compare/dic_s_pilot
model:
  backbone: dic_s
  flow: {type: linear, time_scale: 1000.0}
  condition: {lidar_channels: 32, layout_channels: 2, gate_init: 0.1}
  dic:
    input_size: 256
    in_channels: 3
    hidden_size: 96
    depth: [6, 6, 5, 6, 6]
    mult_channels: [1, 2, 4, 2, 1]
    skip_stride: 3
    final_norm: layernorm2d
