schema: desescene-research-backlog-v1
registered: '2026-10-24'
repository: shuaiqianende/FPSGen-private
training_seed: 20261032
batch_per_gpu: 2
successful_frame_exposures: 20000
automatic_100k: false
extra_training_seeds: false
experiments:
  - id: local_state_position
    status: engineering_validation
    config: stage2_384_child_local_position_20k.yaml
    preferred_gpu: 1
    prerequisites: [gpu_correctness, branch_gradients, maximum_batch2, checkpoint_resume, smoke32]
  - id: local_state_position_attention
    status: engineering_validation
    config: stage2_384_child_local_attention_20k.yaml
    preferred_gpu: 3
    prerequisites: [gpu_correctness, branch_gradients, maximum_batch2, checkpoint_resume, smoke32]
  - id: encoder_only_adaptation
    status: registered_not_engineering_ready
    objective: original_stage1_fm
    initialization: mature_stage1_ema
    frozen: [stage1_flow]
    trainable: [encoder]
    prerequisites: [explicit_finetune_runner, source_sha, frozen_parameter_check, batch2_gradients, resume, smoke]
  - id: encoder_and_flow_adaptation
    status: registered_not_engineering_ready
    objective: original_stage1_fm
    initialization: same_mature_stage1_ema
    trainable: [encoder, stage1_flow]
    prerequisites: [explicit_finetune_runner, matched_encoder_only_protocol, batch2_gradients, resume, smoke]
  - id: encoder_scratch_followup
    status: conditional_design
    initialization: scratch
    prerequisites: [distinct_architecture_hypothesis, matching_r0_control_or_verified_reusable_reference, batch2_gradients, smoke]
completion_policy:
  evaluate_development_frames: 900
  preserve_negative_results: true
  require_same_backend_runtime: true
  stop_on_failed_engineering_check: true
  preserve_existing_jobs: true
