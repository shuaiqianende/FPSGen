experiment:
    id: bev_legacy_gt_possion

# Legacy BEVFlowTransNet under the same Stage-1/data contract as DiC-S and
# PixelU-S.  ``model.backbone: legacy`` explicitly selects the historical core.
data:
    data_dir: ''
    gt_dir: 'gt_possion'
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: false
    std_axis_norm: false

train:
    n_gpus: 2
    num_workers: 2
    max_epoch: 500
    lr: 0.0001
    batch_size: 8

model:
    backbone: legacy
