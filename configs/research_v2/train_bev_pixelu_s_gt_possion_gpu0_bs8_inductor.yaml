experiment:
    id: bev_pixelu_s_gt_possion_gpu0_bs8_inductor

# Formal Stage-1 PixelU-S-BEV run.  It preserves the standard FPSGen linear
# Flow Matching target and eight-condition training distribution.
data:
    data_dir: ''
    gt_dir: 'gt_possion'
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: false
    std_axis_norm: false

train:
    n_gpus: 1
    num_workers: 4
    max_epoch: 500
    checkpoint_every_n_epochs: 20
    lr: 0.0001
    # PixelU-S has patch-16 tokens; batch eight is an even cardinality and
    # leaves headroom for the existing GPU0 process.
    batch_size: 8

runtime:
    compile_dense: true
    compile_backend: inductor
    precision: fp32

model:
    backbone: pixelu_s
    flow:
        type: linear
        time_scale: 1000.0
    condition:
        lidar_channels: 32
        layout_channels: 2
        context_tokens: 32
        gate_init: 0.0
    pixelu:
        input_size: 256
        in_channels: 3
        patch_size: 16
        hidden_size: 384
        num_heads: 6
        depth: [4, 4, 4]
        bottleneck_dim: 64
        in_context_len: 32
        skip: true
        skip_all_blocks: true
        repa: false
