experiment: {id: fpsgen_bev_pixeldit_s_5ep_b8_gpu3}
data:
  data_dir: ''
  gt_dir: gt_possion
  resolution: 0.05
  dataloader: KITTI
  split: train
  train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
  num_points: 180000
  max_range: 50.0
  dataset_norm: false
  std_axis_norm: false
train:
  n_gpus: 1
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4
  pin_memory: true
  deterministic_worker_init: true
  dataloader_seed: 42
  max_epoch: 5
  lr: 0.0001
  batch_size: 8
  accumulate_grad_batches: 1
  checkpoint_every_n_epochs: 1
  seed: 42
runtime:
  compile_dense: false
  async_batch_transfer: true
  visualization_interval: 1000
  throughput_csv: outputs/research_v2/bev_train/profiles/fpsgen_bev_pixeldit_s_5ep_b8_gpu3_throughput.csv
  throughput_interval_steps: 50
  throughput_window_steps: 200
model:
  backbone: pixeldit_s
  flow: {type: linear}
  condition: {lidar_channels: 32, layout_channels: 2, fusion: separate_first, pixel: true, patch: true, global: true, gate_init: 0.1, bias: false}
  pixeldit:
    input_size: 256
    patch_size: 16
    in_channels: 3
    hidden_size: 384
    num_groups: 6
    patch_depth: 8
    pixel_hidden_size: 8
    pixel_depth: 4
    pit_adaln_post_modulation: true
    time_scale: 1.0
    repa: false
