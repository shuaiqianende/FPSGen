experiment: {id: smoke_bev_ncsnpp_s_gt_possion_b1}
data:
    data_dir: ''
    gt_dir: 'gt_possion'
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
    num_points: 180000
    max_range: 50.0
    dataset_norm: false
    std_axis_norm: false
train: {n_gpus: 1, num_workers: 2, max_epoch: 1, batch_size: 1, limit_train_batches: 8, checkpoint_every_n_epochs: 999, lr: 0.0001}
runtime: {compile_dense: false}
model:
    backbone: ncsnpp_s
    flow: {type: linear}
    condition: {lidar_channels: 32, layout_channels: 2, gate_init: 0.1}
    ncsnpp:
        input_size: 256
        in_channels: 3
        nf: 96
        ch_mult: [1, 1, 2, 2, 2, 2, 2]
        num_res_blocks: 2
        attn_resolutions: [16]
        resblock_type: biggan
        resamp_with_conv: true
        fir: true
        fir_kernel: [1, 3, 3, 1]
        skip_rescale: true
        progressive: output_skip
        progressive_input: input_skip
        progressive_combine: sum
        attention_type: ddpm
        init_scale: 0.0
        conv_size: 3
        time_scale: 1000.0
