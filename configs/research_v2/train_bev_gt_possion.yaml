experiment:
    id: research_v2_bev_gt_possion

# Explicit future-training data contract. Historical baseline configs retain
# their default gt_ directory for checkpoint reproducibility.
data:
    data_dir: ''
    gt_dir: gt_possion
    resolution: 0.05
    dataloader: KITTI
    split: train
    train: ['00', '01', '02', '03', '04', '05', '06', '07', '09', '10']
    num_points: 180000
    max_range: 50.0
    dataset_norm: false
    std_axis_norm: false

train:
    n_gpus: 1
    num_workers: 2
    max_epoch: 500
    lr: 0.0001
    batch_size: 8
