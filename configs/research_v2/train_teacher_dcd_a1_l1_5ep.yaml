experiment:
    id: teacher_dcd_a1_l1_5ep

# Stage 2 teacher. Keep this contract identical to configs/train_teacher.yaml;
# the only method change is the DCD-only loss block below.
data:
    data_dir: ''  # Set TRAIN_DATABASE to the dataset root.
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: False
    std_axis_norm: False

train:
    n_gpus: 1
    num_workers: 4
    max_epoch: 5
    lr: 0.001
    batch_size: 2

model:
    out_dim: 96

loss:
    type: dcd
    alpha: 1.0
    lambda: 1.0
    non_reg: false
