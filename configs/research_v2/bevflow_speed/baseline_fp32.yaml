experiment: {id: fpsgen_bevflow_legacy_speed_b0}
data:
  data_dir: ''
  gt_dir: gt_possion
  resolution: 0.05
  dataloader: KITTI
  split: train
  train: ['00','01','02','03','04','05','06','07','09','10']
  num_points: 180000
  max_range: 50.0
  dataset_norm: false
  std_axis_norm: false
train:
  n_gpus: 1
  num_workers: 4
  max_epoch: 1
  limit_train_batches: 1500
  checkpoint_every_n_epochs: 1
  lr: 0.0001
  batch_size: 8
  seed: 42
model: {backbone: legacy}
runtime: {compile_dense: false, visualization_interval: 100}
