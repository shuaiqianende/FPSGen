experiment:
    id: bev_dic_s_gt_possion

# Stage-1 Flow Matching contract is identical to configs/train_bev.yaml.
data:
    data_dir: ''
    gt_dir: 'gt_possion'
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: false
    std_axis_norm: false

train:
    n_gpus: 2
    num_workers: 2
    max_epoch: 500
    lr: 0.0001
    batch_size: 8

model:
    backbone: dic_s
    flow:
        type: linear
        time_scale: 1000.0
    condition:
        lidar_channels: 32
        layout_channels: 2
        injection: stage_add
        gate_init: 0.0
    dic:
        input_size: 256
        in_channels: 3
        hidden_size: 96
        depth: [6, 6, 5, 6, 6]
        mult_channels: [1, 2, 4, 2, 1]
        skip_stride: 3
        learn_sigma: false
