experiment:
    id: bev_pixelu_s_gt_possion

# Stage-1 Flow Matching contract is identical to configs/train_bev.yaml.
data:
    data_dir: ''
    gt_dir: 'gt_possion'
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: false
    std_axis_norm: false

train:
    n_gpus: 2
    num_workers: 2
    max_epoch: 500
    lr: 0.0001
    batch_size: 8

model:
    backbone: pixelu_s
    flow:
        type: linear
        time_scale: 1000.0
    condition:
        lidar_channels: 32
        layout_channels: 2
        context_tokens: 32
        gate_init: 0.0
    pixelu:
        input_size: 256
        in_channels: 3
        patch_size: 16
        hidden_size: 384
        num_heads: 6
        depth: [4, 4, 4]
        bottleneck_dim: 64
        in_context_len: 32
        skip: true
        skip_all_blocks: true
        repa: false
