experiment:
    id: teacher_dcd_a1_l1_5ep_ddp2

# Two-process DDP. batch_size is per process: 1 x 2 GPUs = global batch 2.
data:
    data_dir: ''
    resolution: 0.05
    dataloader: 'KITTI'
    split: 'train'
    train: [ '00', '01', '02', '03', '04', '05', '06', '07', '09', '10' ]
    num_points: 180000
    max_range: 50.
    dataset_norm: False
    std_axis_norm: False

train:
    n_gpus: 2
    num_workers: 4
    max_epoch: 5
    lr: 0.001
    batch_size: 1

model:
    out_dim: 96

loss:
    type: dcd
    alpha: 1.0
    lambda: 1.0
    non_reg: false
